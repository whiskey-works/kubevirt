name: Build KubeVirt Images

on:
  push:
    branches:
      - main
      - 'hotplug-fix-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: whiskey-works/kubevirt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run virt-controller unit tests
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running virt-controller unit tests (includes hotplug fix tests)..." >> $GITHUB_STEP_SUMMARY

          # Run tests for virt-controller VMI handling (where hotplug fix lives)
          make bazel-test WHAT="//pkg/virt-controller/watch/vmi/..."

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All virt-controller tests passed" >> $GITHUB_STEP_SUMMARY

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          # Use short SHA for branch builds
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${BRANCH}-${SHORT_SHA}"

      - name: Build multi-arch images with dockerized Bazel
        env:
          DOCKER_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          DOCKER_TAG: ${{ steps.version.outputs.tag }}
          BUILD_ARCH: amd64,crossbuild-aarch64
        run: |
          echo "Building multi-arch images (amd64 + arm64)"
          echo "DOCKER_PREFIX=$DOCKER_PREFIX DOCKER_TAG=$DOCKER_TAG BUILD_ARCH=$BUILD_ARCH"
          make bazel-build-images

      - name: Push multi-arch images
        if: github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false')
        env:
          DOCKER_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          DOCKER_TAG: ${{ steps.version.outputs.tag }}
          BUILD_ARCH: amd64,crossbuild-aarch64
        run: |
          echo "Pushing multi-arch images (amd64 + arm64)"
          make bazel-push-images

      - name: Output image references
        if: github.event_name != 'pull_request'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "## Built Images (multi-arch: amd64 + arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| virt-operator | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-operator:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| virt-api | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-api:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| virt-controller | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-controller:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| virt-handler | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-handler:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| virt-launcher | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-launcher:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image -n kubevirt deployment/virt-controller virt-controller=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-controller:${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image -n kubevirt daemonset/virt-handler virt-handler=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/virt-handler:${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
